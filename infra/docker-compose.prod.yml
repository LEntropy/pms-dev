version: "3.9"

# 프로덕션 배포용 — 소스 코드 볼륨 마운트 없음, 이미지 기반 실행
# 실행: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pms}
      POSTGRES_USER: ${POSTGRES_USER:-pms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}

  redis:
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 512mb --maxmemory-policy allkeys-lru

  minio:
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}

  pms-server:
    restart: always
    volumes:
      - jwt_keys:/app/keys
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PATCHES: patches
      MINIO_BUCKET_AGENTS: agents
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      DEBUG: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-pms@company.com}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-DC=company,DC=com}

  celery-worker:
    restart: always
    volumes:
      - jwt_keys:/app/keys
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PATCHES: patches
      MINIO_BUCKET_AGENTS: agents
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-pms@company.com}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-DC=company,DC=com}

  celery-beat:
    restart: always
    volumes:
      - jwt_keys:/app/keys
      - celerybeat_data:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pms}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pms}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../pms-dashboard/dist:/usr/share/nginx/html:ro

volumes:
  celerybeat_data:
